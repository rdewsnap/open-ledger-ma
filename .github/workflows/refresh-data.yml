# Pulls fresh CTHRU data, rebuilds and checks it, commits it and deploys the site.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# SOCRATA_APP_TOKEN is optional (fewer rate limits on the CTHRU API).
name: Refresh data

on:
  schedule:
    - cron: '0 11 * * 1' # Mondays, 11:00 UTC (early morning in Massachusetts)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Stop early if the deploy secrets are missing
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # etl/raw is not committed, so this pulls every year from scratch.
      - name: Pull, build and check the data
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: make all

      - name: Test and build the site
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Commit the refreshed data
        run: |
          git config user.name "Ryan Dewsnap"
          git config user.email "87081041+rdewsnap@users.noreply.github.com"
          git add data METHODOLOGY.md
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh data from CTHRU ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Deploy
        run: pnpm exec wrangler deploy
